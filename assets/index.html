<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <!-- https://webkit.org/blog/7929/designing-websites-for-iphone-x/ -->
  <meta name="viewport" content="initial-scale=1, viewport-fit=cover, width=device-width, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FFF">
  <meta name="background-color" content="#FFF">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="manifest" href="/assets/site.webmanifest">
  <title>Squad</title>
  <link rel="stylesheet" href="/assets/reset.css">
  <link rel="stylesheet" href="/assets/github.min.css">
  <link rel="stylesheet" href="/assets/index.css">
  <link rel="stylesheet" href="/assets/bundle.css">
  <script src="/assets/react.production.min.js"></script>
  <script src="/assets/react-dom.production.min.js"></script>
  <script src="/assets/markdown-it.min.js"></script>
  <script src="/assets/highlight.min.js"></script>
  <script>
    // A worker can only intercept paths under the URL it was fetched from, so the /sw.js route widens its scope to the whole site.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(error => {
        console.error('[sw] registration failed', error);
      });
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <div class="modal-root"></div>
  <div class="toast-root"></div>
  <script src="/assets/bundle.js"></script>
</body>

</html>
